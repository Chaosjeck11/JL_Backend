services:
  db:
    image: postgres:16
    container_name: jl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jl_db}
      POSTGRES_USER: ${POSTGRES_USER:-jl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - jl-net

  backend:
    build: ./backend
    container_name: jl-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - /mnt/lokal_nas/storage/services/Junge_loewen:/app/uploads
    depends_on:
      - db
    networks:
      - jl-net
    ports:
      - "3000:3000"

networks:
  jl-net:
    driver: bridge
