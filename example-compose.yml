services:
  db:
    image: postgres:16
    container_name: jl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jl_db
      POSTGRES_USER: jl_user
      POSTGRES_PASSWORD: jl_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - jl-net

  backend:
    build: ./backend
    container_name: jl-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - jl-net
    ports:
      - "3000:3000"

networks:
  jl-net:
    driver: bridge
