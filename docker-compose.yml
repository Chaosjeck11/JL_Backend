services:
  db:
    image: postgres:16
    container_name: jl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jl_db}
      POSTGRES_USER: ${POSTGRES_USER:-jl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - jl-net

  backend:
    build: ./backend
    container_name: jl-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jl_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-jl_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - /mnt/lokal_nas/storage/services/Junge_loewen:/app/uploads
      - ./Builds:/Builds
    depends_on:
      - db
    networks:
      - jl-net
      - web
    ports:
      - "3000:3000"

networks:
  jl-net:
    driver: bridge
  web:
    external: true
